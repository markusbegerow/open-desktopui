name: Release

# Builds the Tauri desktop app for Windows, macOS, and Linux and attaches the
# installers to a draft GitHub Release. Triggered by pushing a version tag
# (v*.*.*), or manually (workflow_dispatch) to test the build without cutting
# a real release — see docs/RELEASING.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  preflight:
    name: Verify release prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # B: Versionsnummern mit dem Git-Tag vergleichen
      - name: Verify version numbers
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Ungültiges Version-Tag: ${tag}`);
          }

          const expected = tag.slice(1);
          const root = 'apps/desktop';

          const pkg = JSON.parse(
            fs.readFileSync(`${root}/package.json`, 'utf8')
          );
          const tauri = JSON.parse(
            fs.readFileSync(
              `${root}/src-tauri/tauri.conf.json`, 'utf8'
            )
          );

          const cargo = fs.readFileSync(
            `${root}/src-tauri/Cargo.toml`, 'utf8'
          );

          const packageSection = cargo
            .split(/^\[/m)
            .find(section => section.startsWith('package]'));

          const cargoVersion = packageSection
            ?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          const versions = {
            'package.json': pkg.version,
            'tauri.conf.json': tauri.version,
            'Cargo.toml': cargoVersion
          };

          let valid = true;

          for (const [file, version] of Object.entries(versions)) {
            if (version === expected) {
              console.log(`OK: ${file} = ${version}`);
            } else {
              console.error(
                `FEHLER: ${file} = ${version}, erwartet ${expected}`
              );
              valid = false;
            }
          }

          if (!valid) {
            process.exit(1);
          }

          console.log(`Version ${tag} erfolgreich geprüft.`);
          NODE

      # C: Erfolgreiche CI für exakt denselben Commit
      - name: Verify successful CI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 30 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                event: 'push',
                per_page: 100
              });

              const runs = data.workflow_runs
                .filter(run =>
                  run.head_sha === sha &&
                  ['main', 'master'].includes(run.head_branch)
                )
                .sort((a, b) => b.id - a.id);

              const run = runs[0];

              if (run?.conclusion === 'success') {
                core.info(`CI erfolgreich: ${run.html_url}`);
                return;
              }

              if (run?.status === 'completed') {
                core.setFailed(
                  `CI fehlgeschlagen (${run.conclusion}): ${run.html_url}`
                );
                return;
              }

              core.info(
                run
                  ? `CI läuft noch: ${run.status}`
                  : `Warte auf CI für Commit ${sha}`
              );

              await new Promise(resolve =>
                setTimeout(resolve, 30000)
              );
            }

            core.setFailed(
              `Keine erfolgreiche CI innerhalb von 30 Minuten für ${sha}`
            );
  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"
          - platform: "ubuntu-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # Tauri v2's documented Ubuntu build dependencies — Windows/macOS
      # runners already have everything they need preinstalled.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workingDirectories: apps/desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Freeze oikb into a standalone binary (PyInstaller doesn't cross-compile,
      # so each matrix runner builds its own) and place it where Tauri's
      # externalBin expects it: binaries/oikb-<target-triple>[.exe]. The
      # externalBin entry lives in tauri.sidecar.conf.json and is merged in
      # only for these CI builds (--config below), so plain `tauri dev` /
      # `cargo check` don't need the binary to exist.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # oikb-main/ is not committed to this repo, so fetch upstream oikb for
      # the build. Pin OIKB_REF to a tag/commit once you know which version
      # you tested against, so releases are reproducible.
      - name: Fetch oikb source
        shell: bash
        env:
          OIKB_REF: main
        run: |
          [ -d oikb-main ] || git clone --depth 1 --branch "$OIKB_REF" https://github.com/open-webui/oikb.git oikb-main

      - name: Build oikb sidecar
        shell: bash
        env:
          # uv would otherwise pick the newest interpreter (3.15 pre-release
          # on current runners), which PyInstaller and oikb's deps don't support.
          UV_PYTHON: "3.12"
        run: |
          cd packaging/oikb-sidecar
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1
            EXT=".exe"
          else
            bash ./build.sh
            EXT=""
          fi
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p ../../apps/desktop/src-tauri/binaries
          cp "dist/oikb$EXT" "../../apps/desktop/src-tauri/binaries/oikb-$TRIPLE$EXT"
          # Smoke test: the frozen binary must at least start.
          "dist/oikb$EXT" --help

      # Real release: only when triggered by pushing a version tag.
      #
      # Code-signing secrets (see docs/RELEASING.md's "Adding code signing
      # later"). An unset secret expands to an EMPTY STRING, and the Tauri CLI
      # treats an empty-but-defined APPLE_CERTIFICATE as "configured" and
      # fails trying to import it. So the signing vars are only exported into
      # the environment when their certificate secret is actually non-empty;
      # otherwise the build stays unsigned. Populating the secrets in the repo
      # is the only step needed to turn signing on.
      - name: Export signing env (only if configured)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_group() {
            local gate="$1"; shift
            [ -n "${!gate}" ] || return 0
            for name in "$@"; do
              if [ -n "${!name}" ]; then
                {
                  echo "$name<<__EOF_SECRET__"
                  echo "${!name}"
                  echo "__EOF_SECRET__"
                } >> "$GITHUB_ENV"
              fi
            done
          }
          export_group WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD
          export_group APPLE_CERTIFICATE APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

      - name: Build and publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater manifest (latest.json) so already-installed
          # copies can verify a downloaded update before applying it — see
          # docs/RELEASING.md's "Auto-updates" section for how this keypair
          # was generated and where the private half lives.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Open DesktopUI ${{ github.ref_name }}"
          releaseBody: |
            ## Installers aren't code-signed

            Your OS will warn you on first launch — that's expected, not a sign of a bad download. It's fine to run anyway:

            - **Windows**: click "More info", then "Run anyway" on the SmartScreen prompt.
            - **macOS**: if you see "app is damaged and can't be opened", run `xattr -cr "/Applications/Open DesktopUI.app"` in Terminal (move the app to /Applications first). Otherwise right-click the app → **Open**.
            - **Linux**: no equivalent warning — nothing extra to do.

            You only need to do this once per install.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.sidecar.conf.json

      # Manual test run (workflow_dispatch, no tag): build only, no release
      # created — the installers are uploaded as a workflow artifact instead
      # so you can download and sanity-check them without touching Releases.
      - name: Build only (manual test run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.sidecar.conf.json

      - name: Upload build artifacts (manual test run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v6
        with:
          name: opendesktopui-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
