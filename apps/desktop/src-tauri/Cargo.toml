[package]
name = "opendesktopui"
version = "0.1.0"
description = "A native desktop chat client for Open WebUI, with oikb Knowledge Base sync built in"
authors = ["Markus Begerow <mail@markus-begerow.de>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-stronghold = { version = "2.4.0", features = ["kdf"] }
log = "0.4.34"
tauri-plugin-log = "2.10.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
